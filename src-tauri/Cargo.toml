[package]
name = "endly"
version = "1.0.1"
description = "Endly - Modern Cross-Platform API Client"
authors = ["Endly Team"]
edition = "2021"

[lib]
name = "endly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-http = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "multipart", "cookies", "gzip", "brotli"] }
tokio = { version = "1", features = ["full"] }
