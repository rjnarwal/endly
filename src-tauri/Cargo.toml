[package]
name = "endly"
version = "1.0.1"
description = "Endly - Modern Cross-Platform API Client"
authors = ["Endly Team"]
edition = "2021"

[lib]
name = "endly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "multipart", "cookies", "gzip", "brotli", "deflate"] }
tokio = { version = "1", features = ["full"] }
rcgen = { version = "0.13", features = ["pem", "ring"] }
rustls = { version = "0.23", features = ["ring", "std"] }
tokio-rustls = { version = "0.26", features = ["ring", "default"] }
rustls-pki-types = "1"
