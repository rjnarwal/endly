name: Release Native Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && (matrix.args == '--target aarch64-apple-darwin' && 'aarch64-apple-darwin' || 'x86_64-apple-darwin') || '' }}

      - name: Install Linux System Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libjavascriptcoregtk-4.1-dev

      - name: Install Dependencies
        run: npm install

      - name: Clean Conflicting Release Assets
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              const tag = context.ref.replace('refs/tags/', '').replace('refs/heads/', '');
              const targetTag = tag.startsWith('v') ? tag : 'v1.0.1';
              let release = null;
              let retries = 3;
              
              while (retries > 0) {
                try {
                  release = await github.rest.repos.getReleaseByTag({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    tag: targetTag
                  });
                  break;
                } catch (err) {
                  retries--;
                  console.log(`GitHub API notice (${err.message}). Retries remaining: ${retries}`);
                  if (retries > 0) {
                    await new Promise(r => setTimeout(r, 2000));
                  }
                }
              }
              
              if (release && release.data && release.data.assets) {
                for (const asset of release.data.assets) {
                  const name = asset.name.toLowerCase();
                  const isDebOrAppImage = name.endsWith('.deb') || name.endsWith('.appimage') || name.endsWith('.rpm') || name.endsWith('.deb.sig');
                  const isElectronBloat = asset.size > 20000000;
                  if (isDebOrAppImage || isElectronBloat) {
                    console.log(`Deleting conflicting asset: ${asset.name} (id: ${asset.id})`);
                    try {
                      await github.rest.repos.deleteReleaseAsset({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        asset_id: asset.id
                      });
                    } catch (delErr) {
                      console.log(`Failed deleting ${asset.name}:`, delErr.message);
                    }
                  }
                }
              }
            } catch (e) {
              console.log('Cleanup notice (non-fatal):', e.message);
            }

      - name: Build Native Tauri App & Publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Endly v__VERSION__'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
